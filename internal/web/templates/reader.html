{{define "reader"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="csrf-token" content="{{.CSRF}}"><meta name="color-scheme" content="light dark"><script>{{.ThemeScript}}</script><title>{{.Book.Title}} · Bookshelf</title><link rel="icon" href="{{asset "favicon.svg"}}" type="image/svg+xml"><link rel="stylesheet" href="{{asset "app.css"}}"><script type="module" src="{{asset "reader.js"}}" defer></script></head><body class="reader-page"><main id="reader-app" class="reader-app is-loading" data-book-id="{{.Book.ID}}" data-format="{{.Book.Format}}" data-file-hash="{{.Book.FileHash}}" data-page-count="{{.Book.PageCount}}" data-file-url="/api/books/{{.Book.ID}}/file" data-worker-url="{{asset "pdf.worker.js"}}"><header class="reader-toolbar"><a class="reader-control" href="/" aria-label="Back to library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span class="reader-control-label">Library</span></a><button class="reader-control reader-contents" id="toc-toggle" type="button" aria-expanded="false">Contents</button><div class="reader-title"><h1>{{.Book.Title}}</h1><p id="reader-progress">Restoring position…</p></div><div class="reader-controls"><button class="reader-control reader-paper-control" id="pdf-tone" type="button" aria-label="Change PDF page background" title="Change PDF page background">Paper</button><button class="reader-control" id="decrease" type="button" aria-label="Decrease font size or zoom">−</button><button class="reader-control" id="increase" type="button" aria-label="Increase font size or zoom">+</button><button class="reader-control" id="theme" type="button" aria-label="Toggle theme">◐</button></div><span id="sync-state" class="sync-state" role="status">Booting</span></header><aside id="toc" class="reader-toc" hidden aria-label="Table of contents"><ol id="toc-list"></ol></aside><section id="reader-stage" class="reader-stage" aria-label="Book content"><div id="epub-viewer"></div><canvas id="pdf-canvas" hidden></canvas><div id="reader-loading">Opening the saved location…</div></section></main></body></html>{{end}}
