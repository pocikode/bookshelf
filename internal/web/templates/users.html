{{define "users"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>{{.ThemeScript}}</script><title>Users · Bookshelf</title><link rel="icon" href="{{asset "favicon.svg"}}" type="image/svg+xml"><link rel="stylesheet" href="{{asset "app.css"}}"></head><body class="app-page"><header class="site-header"><div class="shell site-header-inner"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11.5H8.5A3.5 3.5 0 0 1 5 16V4.5Z"/><path d="M5 16a3.5 3.5 0 0 1 3.5-3.5H19"/></svg></span><span>Bookshelf <small>private library</small></span></a><nav class="site-nav"><a class="nav-link" href="/">Library</a><a class="nav-link" href="/settings">Settings</a><a class="nav-link nav-link-active" href="/admin/users">Users</a></nav></div></header><main class="shell settings-main"><p class="eyebrow">Administration</p><h1>Users</h1><p class="page-intro">Create accounts for people who can use this bookshelf.</p><section class="settings-panel"><h2>Add user</h2><form method="post" action="/admin/users"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><label class="form-label">Username<input class="field" name="username" required maxlength="64" autocomplete="off"></label><label class="form-label">Password<input class="field" type="password" name="password" required minlength="8" autocomplete="new-password"></label><button class="button-primary" type="submit">Create user</button></form></section><section class="settings-panel"><h2>Accounts</h2><ul>{{range .Users}}<li><strong>{{.Username}}</strong> <span>{{.Role}}</span>{{if not .Disabled}}<form method="post" action="/admin/users/{{.ID}}/password"><input type="hidden" name="csrf_token" value="{{$.CSRF}}"><label>Reset password <input class="field" type="password" name="password" required minlength="8" autocomplete="new-password"></label><button class="button-quiet" type="submit">Reset</button></form>{{end}}</li>{{end}}</ul></section></main></body></html>{{end}}
