{{define "login"}}<!doctype html>
<html lang="en" class="h-full"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><script>{{.ThemeScript}}</script><title>Sign in · Bookshelf</title><link rel="icon" href="{{asset "favicon.svg"}}" type="image/svg+xml"><link rel="stylesheet" href="{{asset "app.css"}}"></head>
<body class="min-h-full bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100"><main class="mx-auto flex min-h-screen max-w-md items-center px-6"><section class="w-full rounded-3xl border border-stone-200 bg-white p-8 dark:border-stone-800 dark:bg-stone-900" aria-labelledby="login-title"><p class="eyebrow">Private library</p><h1 id="login-title" class="mt-2 text-4xl font-semibold tracking-tight">Bookshelf</h1><p class="mt-3 text-stone-600 dark:text-stone-400">Your books and reading position, on every device.</p>{{if .Error}}<div class="mt-6 rounded-xl bg-red-50 p-3 text-sm text-red-800 dark:bg-red-950 dark:text-red-200" role="alert" id="login-error">{{.Error}}</div>{{end}}<form method="post" action="/login" class="mt-7 space-y-5"><input type="hidden" name="return_to" value="{{.ReturnTo}}"><label class="block"><span class="text-sm font-medium">Password</span><input class="field mt-2" type="password" name="password" required autofocus autocomplete="current-password" {{if .Error}}aria-describedby="login-error"{{end}}></label><button class="button-primary w-full" type="submit">Sign in</button></form></section></main></body></html>{{end}}
