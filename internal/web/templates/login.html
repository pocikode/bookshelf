{{define "login"}}<!doctype html>
<html lang="en" class="h-full"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><script>{{.ThemeScript}}</script><title>Sign in · Bookshelf</title><link rel="icon" href="{{asset "favicon.svg"}}" type="image/svg+xml"><link rel="stylesheet" href="{{asset "app.css"}}"></head>
<body class="app-page login-page"><main class="login-shell"><section class="login-panel" aria-labelledby="login-title"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11.5H8.5A3.5 3.5 0 0 1 5 16V4.5Z"/><path d="M5 16a3.5 3.5 0 0 1 3.5-3.5H19"/></svg></span><span>Bookshelf <small>private library</small></span></a><p class="eyebrow login-kicker">Private library</p><h1 id="login-title">Your books,<br><em>kept close.</em></h1><p class="login-copy">A personal shelf for the books you return to, with your place held on every device.</p>{{if .Error}}<div class="form-error" role="alert" id="login-error">{{.Error}}</div>{{end}}<form method="post" action="/login" class="login-form"><input type="hidden" name="return_to" value="{{.ReturnTo}}"><label class="form-label">Username<input class="field" type="text" name="username" required autofocus autocomplete="username"></label><label class="form-label">Password<input class="field" type="password" name="password" required autocomplete="current-password" {{if .Error}}aria-describedby="login-error"{{end}}></label><button class="button-primary" type="submit">Sign in</button></form></section><aside class="login-aside" aria-label="Library note"><span class="aside-number">01</span><p>Private by design.<br>Quiet by default.</p><span class="aside-rule"></span><span class="aside-meta">Bookshelf / 2026</span></aside></main></body></html>{{end}}
