name: CI

on:
  push:
    tags: ['v*']
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - uses: actions/cache@v6
        with:
          # `prepare:frontend` installs the generated `.build/` tree with
          # `--no-save`, so there is no lockfile of ours to key on. The pinned
          # submodule's own lockfile plus the override manifest is what decides
          # that dependency set; restoring Bun's global cache keeps the install
          # off the network.
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock', 'readest/pnpm-lock.yaml', 'frontend-overrides/readest-app/package.json') }}
          restore-keys: bun-cache-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build:frontend
      - run: go test ./...
      - run: go vet ./...

  image-platform:
    needs: validate
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ github.ref_name }}-${{ matrix.suffix }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  image:
    needs: image-platform
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}" \
            "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}-arm64"
