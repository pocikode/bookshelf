services:
  bookshelf:
    image: ghcr.io/pocikode/bookshelf:latest
    restart: unless-stopped
    # Every setting has a working default. Without APP_PASSWORD the login
    # password is 123456; set APP_PASSWORD before exposing this service.
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8070:8070"
    volumes:
      - bookshelf-data:/app/data

volumes:
  bookshelf-data:
